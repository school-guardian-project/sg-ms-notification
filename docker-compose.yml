services:
  ms-notification.api:
    container_name: ms-notification
    image: ms-notification.api
    build:
      context: .
      dockerfile: src/ms-notification.Api/Dockerfile
    ports:
      - "8081:8080"
    env_file:
      - .env
    networks:
      - sg-services-network

  ms-notification.tests:
    container_name: ms-notification-tests
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./:/src
    command: dotnet test ./tests/ms-notification.Tests/ --nologo
    profiles: [ "tests" ]
    networks:
      - sg-services-network

networks:
  sg-services-network:
    external: true
